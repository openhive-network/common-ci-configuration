psql_image_test:
  stage: test
  rules:
    - *skip_on_renovate_rule
    - when: on_success
  image:
    name: registry.gitlab.syncad.com/hive/common-ci-configuration/psql:14-2
    entrypoint: [""]
  services:
    - postgres:14
  variables:
    POSTGRES_DB: haf
    POSTGRES_USER: haf_admin
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
    PGHOST: postgres
    PGPORT: 5432
    PGDATABASE: $POSTGRES_DB
    PGUSER: $POSTGRES_USER
    PGPASSWORD: $POSTGRES_PASSWORD
    CI_DEBUG_SERVICES: "false"
  script:
    - |
      set -e

      psql --command="\conninfo"
      psql --list
      psql --command="\set"
  tags:
    - public-runner-docker

# Verifies that the freshly-built psql image actually contains the
# install_with_app_lock.py wrapper, python3, and psycopg2 -- so that HAF apps
# building FROM this image can rely on the advisory-lock skip path working.
# Catches: someone removing the COPY line, dropping py3-psycopg2/python3 from
# apk add, or breaking the wrapper script itself. Runs only when
# build_psql_image runs (rules track the same source paths).
psql_image_assert_wrapper:
  stage: test
  image:
    name: $CI_REGISTRY_IMAGE/psql:$CI_COMMIT_SHORT_SHA
    entrypoint: [""]
  needs:
    - job: build_psql_image
  rules:
    - *skip_on_renovate_rule
    - if: $SKIP_DOCKER_BUILDS == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - Dockerfile.psql
      changes:
        paths:
          - Dockerfile.psql
          - haf-app-tools/scripts/run_with_reconnect.sh
          - haf-app-tools/scripts/install_with_app_lock.py
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      exists:
        - Dockerfile.psql
      changes:
        paths:
          - Dockerfile.psql
          - haf-app-tools/scripts/run_with_reconnect.sh
          - haf-app-tools/scripts/install_with_app_lock.py
        compare_to: 'refs/heads/develop'
  script:
    - |
      set -e
      echo "=== Wrapper file present? ==="
      test -f /usr/local/bin/install_with_app_lock.py || { echo "FAIL: /usr/local/bin/install_with_app_lock.py missing"; exit 1; }
      echo "OK"

      echo "=== python3 available? ==="
      command -v python3 >/dev/null || { echo "FAIL: python3 not in PATH"; exit 1; }
      python3 --version
      echo "OK"

      echo "=== psycopg2 importable? ==="
      python3 -c "import psycopg2; print(f'psycopg2 {psycopg2.__version__}')" \
        || { echo "FAIL: psycopg2 not importable"; exit 1; }
      echo "OK"

      echo "=== Wrapper script imports cleanly? ==="
      python3 -c "
      import importlib.util, sys
      spec = importlib.util.spec_from_file_location('w', '/usr/local/bin/install_with_app_lock.py')
      mod = importlib.util.module_from_spec(spec)
      spec.loader.exec_module(mod)
      assert hasattr(mod, 'main'), 'wrapper has no main()'
      print('wrapper loaded; main() found')
      " || { echo "FAIL: wrapper script has Python errors"; exit 1; }
      echo "OK"

      echo "=== All wrapper-presence assertions PASSED ==="
  tags:
    - public-runner-docker

buildkit_cache_cleanup:
  stage: cleanup
  extends: .buildkit_cleanup_job_template
  allow_failure: true
  # Don't use needs: [] - let it wait for build stage to complete
  # Otherwise it runs concurrently with builds and overloads the registry
  rules:
    - *skip_on_renovate_rule
    - !reference [.buildkit_cleanup_job_template, rules]
  variables:
    # Use latest tag since the image may not be built in this pipeline (change detection)
    IMAGE_REMOVER_TAG: latest
    CACHE_REPOSITORIES: "benchmark-test-runner/cache,docker-builder/cache,docker-dind/cache,haf-app-test-runner/cache,python-scripts/cache,nginx/cache,dockerfile/cache,postgrest/cache,python/cache,ci-base-image/cache,ci-base-image-ubuntu/cache"

# =============================================================================
# Renovate Bot
# =============================================================================

.base_renovate:
  image: renovate/renovate:43.31

validate_renovate_config:
  extends:
    - .validation_job
    - .base_renovate
  script:
    - |
      for config in renovate/*.json5; do
        echo "Validating $config..."
        renovate-config-validator "$config"
      done
  rules:
    - *skip_on_renovate_rule
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        paths:
          - renovate/*.json5
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - renovate/*.json5
        compare_to: 'refs/heads/develop'

renovate:
  extends: .base_renovate
  stage: maintenance
  interruptible: false
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "${CI_API_V4_URL}"
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@syncad.com>"
    LOG_LEVEL: info
    LOG_FILE_LEVEL: debug
    # Seconds to wait between processing consecutive repos (0 = no delay).
    INTER_REPO_DELAY: "300"
  before_script:
    - |
      for var in RENOVATE_TOKEN GITHUB_COM_TOKEN; do
        if [ -z "${!var}" ]; then
          echo "Error: ${var} is not set"
          exit 1
        fi
      done
  script:
    # Process repos sequentially so that CI pipelines triggered by one repo
    # have time to finish (or at least start) before the next repo is processed.
    - |
      repos=(
        hive/clive
        hive/schemas
        hive/beekeeper
        hive/wax
        hive/hive
        hive/haf
        hive/hafah
        hive/balance_tracker
        hive/reputation_tracker
        hive/haf_block_explorer
      )
      first=true
      for repo in "${repos[@]}"; do
        if [ "$first" = true ]; then
          first=false
        elif [ "${INTER_REPO_DELAY}" -gt 0 ] 2>/dev/null; then
          echo "===== Waiting ${INTER_REPO_DELAY}s before next repo ====="
          sleep "${INTER_REPO_DELAY}"
        fi
        echo "===== Processing ${repo} ====="
        RENOVATE_REPOSITORIES="[\"${repo}\"]" \
        LOG_FILE="renovate-${repo##*/}.log" \
          renovate
        echo "===== Finished ${repo} ====="
      done
  artifacts:
    paths:
      - renovate-*.log
    expire_in: 1 week
    when: always
  rules:
    - if: '$RENOVATE_RUN == "true"'
  tags:
    - public-runner-docker

