# Profile for hive/common-ci-configuration, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: common-ci-configuration

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/common-ci-configuration"
  id: 386

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/hivemind and hive/haf), so `stable` is omitted and
# `aidev release` never moves develop.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile and
  # scripts/python/requirements.txt.
  image: "registry.gitlab.syncad.com/hive/common-ci-configuration/aidev-tests@sha256:ebc2800ee002e18fa05792c723fbfdaaf0e42905bd92309a728ad56e075bc51b"
  inputs: [".aidev/runtime/Dockerfile", "scripts/python/requirements.txt"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. This repository is CI templates, scripts and Dockerfiles;
# its own CI runs linters only (.gitlab-ci.yml validation stage), and there is no
# test suite yet. So the slots run the same linters plus pytest on tests/
# (skipped, as a recorded case, until tests/ exists). Every slot is the whole
# check set because it takes seconds; `baseline` and `coverage` run only tests/.
# Not covered: the Dockerfiles (CI builds them) and the templates' runtime
# behaviour in consuming projects. See .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "shellcheck", "yamllint", "py-compile", "tests"]
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "shellcheck", "yamllint", "py-compile", "tests"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "tests"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "shellcheck", "yamllint", "py-compile", "tests"]
    artifacts: ["test-results/canary/"]
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "tests"]
    artifacts: ["test-results/coverage/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
