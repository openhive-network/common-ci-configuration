# The rewriter of the tests, shaped as a HAF app's postgrest-rewriter: the rewrite
# rules process_openapi.py writes, then hive.rpc_form with the argument map it
# writes beside them.
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    init_by_lua_block {
        rpc_form = require "hive.rpc_form"
        rpc_arguments = dofile(ngx.config.prefix() .. "conf/rpc_arguments.lua")
    }

    server {
        listen 80 default_server;
        server_name _;

        location / {
            include rewrite_rules.conf;
            rewrite_log on;

            rewrite_by_lua_block {
                rpc_form.forward(rpc_arguments)
            }
            header_filter_by_lua_block {
                rpc_form.restore_head()
            }

            proxy_pass http://postgrest:3000;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
    }
}
