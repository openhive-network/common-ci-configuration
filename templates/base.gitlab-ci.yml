default:
  interruptible: true
  timeout: 1 hour
  artifacts:
    when: always
    expire_in: 24 hours

# Necessary due to a bug.
# See https://gitlab.com/gitlab-org/gitlab/-/issues/418003 for details.
.job-defaults:
  timeout: 1 hour
  interruptible: true
  tags:
    - public-runner-docker

# =============================================================================
# Pre-get-sources hooks for cleaning corrupt git state
# =============================================================================
# These hooks run before GitLab fetches source code, cleaning up corruption
# left by cancelled pipelines (see GitLab #296638, #4600).
#
# Usage in your .gitlab-ci.yml:
#   default:
#     hooks:
#       pre_get_sources_script: !reference [.pre_get_sources_simple, pre_get_sources_script]
#
# Or for repos with submodules:
#       pre_get_sources_script: !reference [.pre_get_sources_with_submodules, pre_get_sources_script]

# Simple version for repos WITHOUT submodules (e.g., nft_tracker, reputation_tracker)
.pre_get_sources_simple:
  pre_get_sources_script:
    - |
      (
      cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
      echo "pre_get_sources: checking $(pwd) for corrupt git state"
      if [ -d ".git" ]; then
        # Remove stale lock files that block git operations
        find .git -name "*.lock" -delete 2>/dev/null || true

        # Check if main repo is corrupt - if so, remove .git to force fresh clone
        if ! git rev-parse HEAD >/dev/null 2>&1; then
          echo "pre_get_sources: main repository corrupt (rev-parse failed), forcing fresh clone"
          rm -rf .git
        # Check if origin remote is configured (missing config file = no remote)
        elif ! git remote get-url origin >/dev/null 2>&1; then
          echo "pre_get_sources: origin remote missing (incomplete clone), forcing fresh clone"
          rm -rf .git
        else
          echo "pre_get_sources: existing repo OK"
        fi
      else
        echo "pre_get_sources: no .git directory (fresh workspace)"
      fi
      )

# Full version for repos WITH submodules (e.g., balance_tracker, haf_block_explorer, hivemind)
# Includes dynamic directory-to-submodule transition detection
.pre_get_sources_with_submodules:
  pre_get_sources_script:
    - |
      (
      cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
      echo "pre_get_sources: checking $(pwd) for corrupt git state"
      if [ -d ".git" ]; then
        # Remove stale lock files that block git operations
        find .git -name "*.lock" -delete 2>/dev/null || true

        # Check if main repo is corrupt - if so, remove .git to force fresh clone
        needs_fresh_clone=false
        if ! git rev-parse HEAD >/dev/null 2>&1; then
          echo "pre_get_sources: main repository corrupt (rev-parse failed), forcing fresh clone"
          needs_fresh_clone=true
        # Check if origin remote is configured (missing config file = no remote)
        elif ! git remote get-url origin >/dev/null 2>&1; then
          echo "pre_get_sources: origin remote missing (incomplete clone), forcing fresh clone"
          needs_fresh_clone=true
        fi

        if [ "$needs_fresh_clone" = true ]; then
          rm -rf .git
          # Also clean orphaned submodule directories that have .git files pointing to
          # the now-removed .git/modules/<name>
          find . -maxdepth 6 -name ".git" -type f 2>/dev/null | while read gitfile; do
            submod_dir=$(dirname "$gitfile")
            if [ "$submod_dir" != "." ]; then
              echo "pre_get_sources: removing orphaned submodule directory: $submod_dir"
              rm -rf "$submod_dir"
            fi
          done
        else
          # Main repo OK - check and clean corrupt submodules
          if [ -f ".gitmodules" ]; then
            git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
              needs_clean=false
              [ -z "$submod" ] && continue
              # Check if submodule working directory exists but is corrupt
              if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                  needs_clean=true
                fi
              fi
              # Check if .git/modules exists but is corrupt (even if working dir is gone)
              if [ -d ".git/modules/$submod" ]; then
                if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                  echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                  needs_clean=true
                fi
              fi
              if [ "$needs_clean" = true ]; then
                echo "pre_get_sources: cleaning corrupt submodule: $submod"
                rm -rf "$submod" ".git/modules/$submod"
              fi
            done
          fi

          # Handle directory-to-submodule transitions: remove directories that became
          # submodules in the target ref but weren't submodules in the current checkout.
          # This handles cases where a path changed from directory to submodule between branches.
          # NOTE: We only remove if the path is NOT already a submodule in current checkout,
          # to avoid breaking GIT_SUBMODULE_STRATEGY=none workflows with uninitialized submodules.
          if [ -n "$CI_COMMIT_REF_NAME" ]; then
            echo "pre_get_sources: checking for directory-to-submodule transitions (ref: $CI_COMMIT_REF_NAME)"
            # Get current checkout's submodules (if any)
            current_submodules=""
            if [ -f ".gitmodules" ]; then
              current_submodules=$(git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | tr '\n' ' ')
            fi
            # Fetch the target ref first (it may not exist locally yet)
            git fetch origin "$CI_COMMIT_REF_NAME" --depth=1 2>&1 || true
            target_gitmodules=$(git show "origin/$CI_COMMIT_REF_NAME:.gitmodules" 2>/dev/null) || true
            if [ -n "$target_gitmodules" ]; then
              echo "$target_gitmodules" | grep "path = " | sed 's/.*path = //' | while read submod; do
                [ -z "$submod" ] && continue
                # Skip if already a submodule in current checkout (might be uninitialized)
                if echo " $current_submodules " | grep -q " $submod "; then
                  continue
                fi
                # If path exists as a regular directory (not a submodule), remove it
                if [ -d "$submod" ] && [ ! -f "$submod/.git" ]; then
                  echo "pre_get_sources: removing directory for submodule transition: $submod"
                  rm -rf "$submod"
                fi
              done
            fi
          fi

          echo "pre_get_sources: existing repo OK"
        fi
      else
        echo "pre_get_sources: no .git directory (fresh workspace)"
        # Clean up orphaned submodule directories - these have .git files pointing
        # to .git/modules/<name> which doesn't exist when .git is missing.
        # Find directories with .git files (submodule markers) and remove them.
        find . -maxdepth 6 -name ".git" -type f 2>/dev/null | while read gitfile; do
          submod_dir=$(dirname "$gitfile")
          if [ "$submod_dir" != "." ]; then
            echo "pre_get_sources: removing orphaned submodule directory: $submod_dir"
            rm -rf "$submod_dir"
          fi
        done
      fi
      )

# Permission fix hook for fetch strategy with cross-user CI jobs
# Different jobs may run as different users; this ensures writable workspaces.
# Usage:
#   default:
#     hooks:
#       pre_get_sources_script:
#         - !reference [.pre_get_sources_with_submodules, pre_get_sources_script]
#         - !reference [.pre_get_sources_permission_fix, pre_get_sources_script]
#
# Or set PERMISSION_FIX_PATHS variable to customize paths:
#   variables:
#     PERMISSION_FIX_PATHS: "hive/libraries/plugins src/generated"
.pre_get_sources_permission_fix:
  pre_get_sources_script:
    - |
      (
      cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
      # Default paths that commonly need permission fixes
      fix_paths="${PERMISSION_FIX_PATHS:-}"
      if [ -z "$fix_paths" ]; then
        # Auto-detect common paths that need fixing
        for path in "hive/libraries/plugins" "libraries/plugins"; do
          [ -d "$path" ] && fix_paths="$fix_paths $path"
        done
      fi
      for path in $fix_paths; do
        if [ -d "$path" ]; then
          echo "pre_get_sources: fixing permissions on $path"
          chmod -R a+w "$path" 2>/dev/null || true
        fi
      done
      )
