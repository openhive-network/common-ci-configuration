variables:
  DOCKER_BUILDER_TAG: "latest"
  DOCKER_DIND_TAG: "latest"
  IMAGE_REMOVER_TAG: "latest"

include:
  - local: templates/base.gitlab-ci.yml

# this version does not call git since it is not present in the pure dind image
.pure_docker_image_builder_job_template:
  extends: .job-defaults
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    FF_NETWORK_PER_BUILD: "true"

  image: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-builder:${DOCKER_BUILDER_TAG}
  before_script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):buildkit_config[collapsed=true]\r\e[0KConfiguring Docker BuildKit..."
      # Wait for docker daemon to be fully ready (up to 60 seconds)
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon ready"
          break
        fi
        echo "Waiting for docker daemon... ($i/30)"
        sleep 2
      done
      docker context create builder-context
      docker buildx create --driver docker-container --name docker-container-builder --use builder-context
      echo -e "\e[0Ksection_end:$(date +%s):buildkit_config\r\e[0K"
  services:
    - name: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-dind:${DOCKER_DIND_TAG}
      alias: docker

.docker_image_builder_job_template:
  extends: .pure_docker_image_builder_job_template
  before_script:
    - !reference [.pure_docker_image_builder_job_template, before_script]
    # Fix workspace permissions for cross-user CI jobs (fetch strategy can leave
    # directories owned by runner user, making them non-writable by container user)
    - |
      if [ ! -w "${CI_PROJECT_DIR}" ]; then
        echo "Workspace not writable by container user, fixing permissions via docker..."
        docker run --rm -v "${CI_PROJECT_DIR}:/workspace" alpine:latest chmod -R a+w /workspace
      fi
    - |
      echo -e "\e[0Ksection_start:$(date +%s):git[collapsed=true]\r\e[0KDisabling Git directory permission check"
      git config --global --add safe.directory '*'
      echo -e "\e[0Ksection_end:$(date +%s):git\r\e[0K"

.docker_image_cleanup_job_template:
  extends: .job-defaults
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/python-scripts:${IMAGE_REMOVER_TAG}
  variables:
    REGISTRY: $CI_REGISTRY_IMAGE
    REGISTRY_PASS: ""
    IMAGE_PATH: ""
    IMAGE_TAG: ""
  script:
    - echo "Attempting to cleanup an image $IMAGE_PATH using tag $IMAGE_TAG from $REGISTRY"
    - python /delete-image.py "$REGISTRY_PASS" "$CI_PROJECT_ID" "$IMAGE_PATH" "$IMAGE_TAG"
  when: always

.buildkit_cleanup_job_template:
  extends: .job-defaults
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/python-scripts:${IMAGE_REMOVER_TAG}
  variables:
    CACHE_REPOSITORIES: ""
  script:
    - echo "Attempting to delete old BuildKit cache from the following repositories $CACHE_REPOSITORIES"
    - python3 /remove-buildkit-cache.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  tags:
    - public-runner-docker

# Template for publishing Docker images to Docker Hub (PUBLIC production registry).
#
# IMPORTANT: This template publishes to the PUBLIC Docker Hub registry!
# By default, only runs on protected tags.
#
# Skip variables (set to "true" to skip this job):
#   - QUICK_TEST: Skip during quick test pipelines
#   - SKIP_PRODUCTION_DEPLOY: Skip all production deployments
#   - SKIP_DOCKER_PUBLISH: Skip all Docker Hub publishing jobs
.publish_docker_image_template:
  extends: .docker_image_builder_job_template
  needs: []
  variables:
    # Note: DOCKER_HUB_USER, DOCKER_HUB_PASSWORD, BLOG_REGISTRY_USER, BLOG_REGISTRY_PASSWORD
    # must be set as CI/CD variables in the project/group settings. Do NOT re-declare them
    # here as `VAR: $VAR` - GitLab CI doesn't properly expand protected variables in that pattern.
    HIVE_BLOG_REGISTRY: registry-upload.hive.blog
  before_script:
    - !reference [.docker_image_builder_job_template, before_script]
    - |
      echo -e "\e[0Ksection_start:$(date +%s):registry_login[collapsed=true]\r\e[0KLogging to Docker registries..."
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [[ -n "${BLOG_REGISTRY_USER:-}" && -n "${BLOG_REGISTRY_PASSWORD:-}" ]]; then
        echo "$BLOG_REGISTRY_PASSWORD" | docker login -u "$BLOG_REGISTRY_USER" --password-stdin "$HIVE_BLOG_REGISTRY"
      fi
      echo -e "\e[0Ksection_end:$(date +%s):registry_login\r\e[0K"
  rules:
    - if: $QUICK_TEST == "true"
      when: never
    - if: $SKIP_PRODUCTION_DEPLOY == "true"
      when: never
    - if: $SKIP_DOCKER_PUBLISH == "true"
      when: never
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never

# Reusable component for pushing images to hive.blog registry.
# Use via !reference in your job's script section.
#
# Required variables:
#   HIVE_BLOG_IMAGE_SOURCE: Source image to tag (e.g., "$CI_REGISTRY_IMAGE/postgrest-rewriter:$TAG")
#   HIVE_BLOG_IMAGE_TARGET: Target path on hive.blog (e.g., "hivemind/postgrest-rewriter:$TAG")
#
# Example usage in repo's .gitlab-ci.yml:
#   build_and_publish_image:
#     extends: .publish_docker_image_template
#     variables:
#       HIVE_BLOG_IMAGE_SOURCE: "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
#       HIVE_BLOG_IMAGE_TARGET: "myapp/postgrest-rewriter:$CI_COMMIT_TAG"
#     script:
#       - scripts/ci-helpers/build_and_publish_instance.sh
#       - !reference [.hive_blog_push, script]
#
.hive_blog_push:
  script:
    - |
      if [[ -n "${HIVE_BLOG_IMAGE_SOURCE:-}" && -n "${HIVE_BLOG_IMAGE_TARGET:-}" ]]; then
        echo "Pushing to hive.blog registry: ${HIVE_BLOG_REGISTRY}/${HIVE_BLOG_IMAGE_TARGET}"
        docker tag "$HIVE_BLOG_IMAGE_SOURCE" "${HIVE_BLOG_REGISTRY}/${HIVE_BLOG_IMAGE_TARGET}"

        # Retry push with exponential backoff (handles transient registry issues)
        MAX_RETRIES=3
        RETRY_DELAY=5
        for attempt in $(seq 1 $MAX_RETRIES); do
          if docker push "${HIVE_BLOG_REGISTRY}/${HIVE_BLOG_IMAGE_TARGET}"; then
            break
          fi
          if [ $attempt -eq $MAX_RETRIES ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
          echo "Push attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
          sleep $RETRY_DELAY
          RETRY_DELAY=$((RETRY_DELAY * 2))
        done
      fi

# =============================================================================
# STANDARDIZED BUILD/PUBLISH TEMPLATES (New Flow)
#
# These templates implement the new standardized Docker publishing flow:
#   1. Build phase: Build once, push to GitLab with SHA + branch/version tags
#   2. Test phase: Validate images (no building)
#   3. Publish phase: Pull/retag/push to external registries (no rebuild)
#
# Tagging convention:
#   - Always: ${CI_COMMIT_SHORT_SHA} (8-char hash)
#   - develop branch: also 'latest'
#   - main/master branch: also 'stable'
#   - Protected tags: also ${CI_COMMIT_TAG}
# =============================================================================

# Standard Docker build template that handles common tagging logic.
#
# This template builds a single Docker image and pushes it to GitLab registry
# with appropriate tags based on branch/tag context.
#
# Required variables:
#   IMAGE_NAME: Name of the image within the registry (e.g., "myapp", "postgrest-rewriter")
#               For the main/root image, use "" to push to $CI_REGISTRY_IMAGE directly
#
# Optional variables:
#   DOCKERFILE_PATH: Path to Dockerfile (default: "Dockerfile")
#   DOCKER_BUILD_TARGET: Dockerfile target stage (default: none)
#   DOCKER_BUILD_CONTEXT: Build context directory (default: ".")
#   DOCKER_BUILD_ARGS: Additional build args (space-separated, e.g., "ARG1=val1 ARG2=val2")
#
# Example usage:
#   build_main_image:
#     extends: .docker_build_job_template
#     variables:
#       IMAGE_NAME: ""
#       DOCKER_BUILD_TARGET: "instance"
#
#   build_rewriter:
#     extends: .docker_build_job_template
#     variables:
#       IMAGE_NAME: "postgrest-rewriter"
#       DOCKERFILE_PATH: "Dockerfile.rewriter"
#
.docker_build_job_template:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    IMAGE_NAME: ""
    DOCKERFILE_PATH: "Dockerfile"
    DOCKER_BUILD_TARGET: ""
    DOCKER_BUILD_CONTEXT: "."
    DOCKER_BUILD_ARGS: ""
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):registry_login[collapsed=true]\r\e[0KLogging to GitLab registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      echo -e "\e[0Ksection_end:$(date +%s):registry_login\r\e[0K"

      # Determine base image path
      if [[ -n "$IMAGE_NAME" ]]; then
        IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
      else
        IMAGE_BASE="${CI_REGISTRY_IMAGE}"
      fi

      # Build tag arguments - use short SHA for consistency with existing repos
      TAGS="--tag ${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}"

      # Branch-specific tags
      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        TAGS="$TAGS --tag ${IMAGE_BASE}:latest"
        echo "Adding 'latest' tag for develop branch"
      elif [[ "$CI_COMMIT_BRANCH" == "main" || "$CI_COMMIT_BRANCH" == "master" ]]; then
        TAGS="$TAGS --tag ${IMAGE_BASE}:stable"
        echo "Adding 'stable' tag for main/master branch"
      fi

      # Protected tag gets version tag
      if [[ -n "${CI_COMMIT_TAG:-}" && "${CI_COMMIT_REF_PROTECTED:-}" == "true" ]]; then
        TAGS="$TAGS --tag ${IMAGE_BASE}:${CI_COMMIT_TAG}"
        echo "Adding version tag '${CI_COMMIT_TAG}' for protected tag"
      fi

      # Build cache configuration
      CACHE_FROM="type=registry,ref=${IMAGE_BASE}/cache:buildcache"
      CACHE_TO="type=registry,ref=${IMAGE_BASE}/cache:buildcache,mode=max"

      # Construct build command
      BUILD_CMD="docker buildx build --provenance=false --progress=plain"
      BUILD_CMD="$BUILD_CMD --cache-from=$CACHE_FROM --cache-to=$CACHE_TO"
      BUILD_CMD="$BUILD_CMD --push"
      BUILD_CMD="$BUILD_CMD $TAGS"

      # Add target if specified
      if [[ -n "$DOCKER_BUILD_TARGET" ]]; then
        BUILD_CMD="$BUILD_CMD --target=$DOCKER_BUILD_TARGET"
      fi

      # Add custom build args if specified
      for ARG in $DOCKER_BUILD_ARGS; do
        BUILD_CMD="$BUILD_CMD --build-arg $ARG"
      done

      BUILD_CMD="$BUILD_CMD -f $DOCKERFILE_PATH $DOCKER_BUILD_CONTEXT"

      echo "Building image: ${IMAGE_BASE}"
      echo "Tags: ${CI_COMMIT_SHORT_SHA}${CI_COMMIT_BRANCH:+ + branch tag}${CI_COMMIT_TAG:+ + version tag}"
      echo "Running: $BUILD_CMD"

      eval $BUILD_CMD

      # Export image reference for downstream jobs
      echo "BUILD_IMAGE_REF=${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}" >> build.env
      echo "BUILD_IMAGE_BASE=${IMAGE_BASE}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# Standard Docker publish template for pushing images to external registries.
#
# This template implements the "pull/retag/push" pattern - NO rebuilding.
# It pulls images from GitLab registry using the protected tag (for security)
# and pushes them to registry.hive.blog.
#
# IMPORTANT: This job only runs on protected tags. Images must already exist
# in GitLab registry with the version tag from the build phase.
#
# Required variables:
#   PUBLISH_IMAGES: Space-separated list of images to publish
#                   e.g., "myapp postgrest-rewriter" or just "myapp"
#
# Optional variables:
#   HIVE_BLOG_REGISTRY: Target registry (default: "registry-upload.hive.blog")
#   PUBLISH_PROJECT_NAME: Project name on target registry (default: $CI_PROJECT_NAME)
#
# Example usage:
#   publish:
#     extends: .docker_publish_job_template
#     variables:
#       PUBLISH_IMAGES: "balance_tracker postgrest-rewriter"
#
#   # For repos with custom project paths on hive.blog:
#   publish:
#     extends: .docker_publish_job_template
#     variables:
#       PUBLISH_IMAGES: "hafah hafah-rewriter"
#       PUBLISH_PROJECT_NAME: "hafah"
#
.docker_publish_job_template:
  extends: .docker_image_builder_job_template
  stage: publish
  variables:
    PUBLISH_IMAGES: ""
    HIVE_BLOG_REGISTRY: "registry-upload.hive.blog"
    PUBLISH_PROJECT_NAME: "${CI_PROJECT_NAME}"
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):registry_login[collapsed=true]\r\e[0KLogging to registries..."
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [[ -n "${BLOG_REGISTRY_USER:-}" && -n "${BLOG_REGISTRY_PASSWORD:-}" ]]; then
        echo "$BLOG_REGISTRY_PASSWORD" | docker login -u "$BLOG_REGISTRY_USER" --password-stdin "$HIVE_BLOG_REGISTRY"
      else
        echo "WARNING: BLOG_REGISTRY_USER or BLOG_REGISTRY_PASSWORD not set, skipping hive.blog login"
      fi
      echo -e "\e[0Ksection_end:$(date +%s):registry_login\r\e[0K"

      # Security: Pull using protected tag (not commit SHA)
      # This ensures we publish the exact tagged version that was validated
      SOURCE_TAG="${CI_COMMIT_TAG}"

      if [[ -z "$SOURCE_TAG" ]]; then
        echo "ERROR: CI_COMMIT_TAG not set. Publish job only runs on protected tags."
        exit 1
      fi

      if [[ -z "$PUBLISH_IMAGES" ]]; then
        echo "ERROR: PUBLISH_IMAGES not set. Specify images to publish."
        exit 1
      fi

      echo "Publishing images for tag: ${SOURCE_TAG}"
      echo "Target registry: ${HIVE_BLOG_REGISTRY}/${PUBLISH_PROJECT_NAME}"

      for IMAGE in $PUBLISH_IMAGES; do
        # Determine source path (handle root image vs subpath)
        if [[ -n "$IMAGE" && "$IMAGE" != "${CI_PROJECT_NAME}" ]]; then
          SOURCE="${CI_REGISTRY_IMAGE}/${IMAGE}:${SOURCE_TAG}"
          TARGET="${HIVE_BLOG_REGISTRY}/${PUBLISH_PROJECT_NAME}/${IMAGE}:${SOURCE_TAG}"
        else
          SOURCE="${CI_REGISTRY_IMAGE}:${SOURCE_TAG}"
          TARGET="${HIVE_BLOG_REGISTRY}/${PUBLISH_PROJECT_NAME}:${SOURCE_TAG}"
        fi

        echo ""
        echo "Publishing: $IMAGE"
        echo "  Source: $SOURCE"
        echo "  Target: $TARGET"

        docker pull "$SOURCE"
        docker tag "$SOURCE" "$TARGET"

        # Retry push with exponential backoff (handles transient registry issues)
        MAX_RETRIES=3
        RETRY_DELAY=5
        for attempt in $(seq 1 $MAX_RETRIES); do
          if docker push "$TARGET"; then
            break
          fi
          if [ $attempt -eq $MAX_RETRIES ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
          echo "Push attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
          sleep $RETRY_DELAY
          RETRY_DELAY=$((RETRY_DELAY * 2))
        done

        echo "  ✓ Published successfully"
      done

      echo ""
      echo "All images published successfully to ${HIVE_BLOG_REGISTRY}"
  rules:
    - if: $QUICK_TEST == "true"
      when: never
    - if: $SKIP_PRODUCTION_DEPLOY == "true"
      when: never
    - if: $SKIP_DOCKER_PUBLISH == "true"
      when: never
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never
