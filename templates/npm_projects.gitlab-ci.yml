include:
  - local: templates/base.gitlab-ci.yml

variables:
  # uses registry.gitlab.syncad.com/hive/common-ci-configuration/emsdk:5.0.2-4 (Node 24.21.0)
  EMSCRIPTEN_IMAGE_TAG: "5.0.2-4@sha256:966dd9e9da494d184fcc7f622bb24d93c41b8d58c814156aa79cd1d70f31d9ab"
  EMSCRIPTEN_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/emsdk:$EMSCRIPTEN_IMAGE_TAG"

.node_based_job_base:
  extends: .job-defaults

  variables:
    # allows to override project directory before starting actual processing
    SOURCE_DIR: "${CI_PROJECT_DIR}"

    FF_NETWORK_PER_BUILD: 1

  image: ${EMSCRIPTEN_IMAGE}  # this image contains all required tools and preinstalled set of common npm packages

  before_script:
    - git config --global --add safe.directory '*'
    - . "${NVM_DIR}/nvm.sh"  # This loads nvm environment
    - nvm use "${NODEJS_VERSION}"  # Force usage of preconfigured NodeJS version
    - cd "${SOURCE_DIR}"  # move to the project directory (where package.json file is located)

.npm_based_job_base:
  extends: .node_based_job_base

  before_script:
    - !reference [.node_based_job_base, before_script]
    - pnpm --recursive install --frozen-lockfile  # install all required dependencies

.filter_out_swagger_json:
  extends: .node_based_job_base
  variables:
    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    DIST_DIR: "${SOURCE_DIR}/build"
    INPUT_SQL_SWAGGER_FILE: "${SOURCE_DIR}/endpoints/endpoint_schema.sql"
    JSON_SWAGGER_FILE: "${DIST_DIR}/swagger-doc.json"

    # Target package meta information - they should be overrided by derived job
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "${CI_PROJECT_NAME}"
    NPM_REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"

  script:
    - /home/emscripten/scripts/npm_generate_version.sh "${SOURCE_DIR}" "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" "${NPM_PACKAGE_SCOPE}" "${NPM_PACKAGE_NAME}" "${CI_COMMIT_REF_PROTECTED}" "${CI_COMMIT_TAG}"
    - source "${SOURCE_DIR}/built_package_version_info.env"
    - mkdir -vp "${DIST_DIR}"
    - cat "${INPUT_SQL_SWAGGER_FILE}" | sed -n '/^  openapi json = \$\$/,/^\$\$/ { /^  openapi json = \$\$/d; /^\$\$/d; p }' | jq ".info.version = \"${BUILT_PACKAGE_VERSION}\"" > "${JSON_SWAGGER_FILE}"
    # Store path relative to CI_PROJECT_DIR so it works across different runner slots.
    # GitLab CI expands variables in dotenv files at load time.
    - echo "BUILT_JSON_SWAGGER_FILE=\${CI_PROJECT_DIR}/${JSON_SWAGGER_FILE#${CI_PROJECT_DIR}/}" > "${SOURCE_DIR}/built_swagger_json.env"

  artifacts:
    reports:
      dotenv:
        - "${SOURCE_DIR}/built_swagger_json.env"  # contains path to produced tgz
    paths:
      - "${JSON_SWAGGER_FILE}"
    when: always
    expire_in: 1 week

.generate_swagger_package:
  extends: .node_based_job_base
  variables:
    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    DIST_DIR: "${SOURCE_DIR}/build"
    INPUT_JSON_SWAGGER_FILE: "${DIST_DIR}/swagger-doc.json"
    OUT_DIR: "${DIST_DIR}/generated"
    WAX_SPEC_GENERATOR_VERSION: "1.7.0"
    NPM_ALREADY_BUILT: 1
    # Target package meta information - they should be overrided by derived job
    NPM_PACKAGE_SCOPE: ""
    NPM_PACKAGE_NAME: ""
    NPM_REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    # Set the namespace if you want to apply one level of nested object in the generated API structure
    NAMESPACE: ""
    # Set this variable to specify the type of API to generate - possible values are: rest, jsonrpc
    API_TYPE: ""

  script:
    - mkdir -vp "${DIST_DIR}"
    - pushd "${DIST_DIR}"
    - echo @hiveio:registry=https://gitlab.syncad.com/api/v4/groups/136/-/packages/npm/ >> .npmrc
    # Ignore package version as it will be replaced in the next step - npm generate version script
    - npx --yes @hiveio/wax-spec-generator@${WAX_SPEC_GENERATOR_VERSION} generate-wax-spec -i "${INPUT_JSON_SWAGGER_FILE}" -o "${OUT_DIR}" -T "${API_TYPE}" ${NAMESPACE:+-N "$NAMESPACE"} -e --npm-name "${NPM_PACKAGE_SCOPE}/${NPM_PACKAGE_NAME}" --npm-version "0.0.0"
    - popd
    - /home/emscripten/scripts/npm_pack_package.sh "${OUT_DIR}" "${NPM_REGISTRY_URL}" "${NPM_PACKAGE_SCOPE}" "${NPM_PACKAGE_NAME}" "${DIST_DIR}" "${CI_COMMIT_REF_PROTECTED}" "${CI_COMMIT_TAG}"

  artifacts:
    reports:
      dotenv:
        - "${OUT_DIR}/built_package_info.env"  # contains path to produced tgz
        - "${OUT_DIR}/built_package_version_info.env"  # contains information related to generated package version and git revision

    paths:
      - "${OUT_DIR}"  # Built source used for package.json manipulation
      - "${DIST_DIR}/*.tgz"  # Built package for publishing
      - "${DIST_DIR}/built_package_info.json"

    when: always
    expire_in: 1 week

# Base definition for job performing an npm build step. Outputs packaged project in *.tgz form
# tgz package path can be received by `BUILT_PACKAGE_PATH` .env variable
.npm_build_template:
  extends: .npm_based_job_base
  variables:
    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    # Output directory where should be stored package - it should be overrided by derived job
    DIST_DIR: ""

    PROJECT_URL: "${CI_PROJECT_URL}"
    REPLACE_DOC_URL_ENV: ""
    REPLACE_FILE_PATH: "${SOURCE_DIR}/README.md"

    # Target package scope - it should be overrided by derived job
    NPM_PACKAGE_SCOPE: ""
    # Target package name - it should be overrided by derived job
    NPM_PACKAGE_NAME: ""
    NPM_REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"

  script:
    - if [ -n $REPLACE_DOC_URL_ENV ]; then /home/emscripten/scripts/npm_set_doc_url.sh "${SOURCE_DIR}" "${PROJECT_URL}" "${CI_COMMIT_REF_NAME}" "${CI_COMMIT_REF_PROTECTED}" "${REPLACE_DOC_URL_ENV}" "${REPLACE_FILE_PATH}"; fi
    - /home/emscripten/scripts/npm_build_package.sh "${SOURCE_DIR}" "${NPM_REGISTRY_URL}" "${NPM_PACKAGE_SCOPE}" "${NPM_PACKAGE_NAME}" "${DIST_DIR}" "${CI_COMMIT_REF_PROTECTED}" "${CI_COMMIT_TAG}"

  artifacts:
    reports:
      dotenv:
        - "gen_doc.env"  # contains URL to generated documentation pointed by `GEN_DOC_URL` variable
        - "${SOURCE_DIR}/built_package_info.env"  # contains path to produced tgz
        - "${SOURCE_DIR}/built_package_version_info.env"  # contains information related to generated package version and git revision

    paths:
      - "${REPLACE_FILE_PATH}"
      - "${DIST_DIR}/*.tgz"  # Built package
      - "${DIST_DIR}/built_package_info.json"

    when: always
    expire_in: 1 week

.npm_process_built_package_tarball:
  extends: .npm_based_job_base
  variables:
    # Path pointing the source directory containing a package.json file - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    # Output directory where the built package tarball is stored - it can be overrided by derived job
    DIST_DIR: ""
    # Path to the built package tarball - computed automatically from DIST_DIR and BUILT_PACKAGE_PATH if not set
    PACKAGE_TGZ_PATH: ""

  before_script:
    - !reference [.npm_based_job_base, before_script]
    # Compute local path from filename (cross-runner compatible) if not explicitly set
    - if [ -z "${PACKAGE_TGZ_PATH}" ] && [ -n "${BUILT_PACKAGE_PATH}" ]; then PACKAGE_TGZ_PATH="${DIST_DIR}/$(basename ${BUILT_PACKAGE_PATH})"; fi
    - echo -e "\e[0Ksection_start:$(date +%s):package_tgz_unpack[collapsed=true]\r\e[0KAttempting to unpack ${PACKAGE_TGZ_PATH}"
    - cd "${CI_PROJECT_DIR}"
    - tar -xf "${PACKAGE_TGZ_PATH}" -C "${SOURCE_DIR}" --strip-components=1
    - echo -e "\e[0Ksection_end:$(date +%s):package_tgz_unpack\r\e[0K"

.npm_test_template:
  extends: .npm_process_built_package_tarball
  variables:
    # Path pointing the source directory containing a package.json file - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    # Path to the built package tarball - it should be overrided by derived job
    PACKAGE_TGZ_PATH: ""

  script:
    - echo -e "\e[0Ksection_start:$(date +%s):testing[collapsed=false]\r\e[0KAttempting to start tests..."
    - cd "${SOURCE_DIR}"
    - npm run test
    - echo -e "\e[0Ksection_end:$(date +%s):testing\r\e[0K"

  artifacts:
    reports:
      junit: "${SOURCE_DIR}/results.xml"

    paths:
      - "${SOURCE_DIR}/results.json"

    when: always
    expire_in: 1 week


# Base definition for NPM package publishing job (to internal GitLab registry).
# The derived job, should have in its dependencies a final job performing a npm-build (derived from `.npm_build_template`)
#
# Skip variables (set to "true" to skip this job):
#   - QUICK_TEST: Skip during quick test pipelines
#   - SKIP_DEV_DEPLOY: Skip dev package deployments specifically
#   - SKIP_NPM_PUBLISH: Skip all npm publishing jobs
.npm_deploy_package_template:
  extends: .npm_process_built_package_tarball
  variables:
    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    # Path to the built package tarball - it should be overrided by derived job
    PACKAGE_TGZ_PATH: ""
    # Target package scope - it should be overrided by derived job
    NPM_PACKAGE_SCOPE: ""
    NPM_REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    NPM_PUBLISH_TOKEN: "${CI_JOB_TOKEN}"

  script:
    - echo -e "\e[0Ksection_start:$(date +%s):publishing[collapsed=false]\r\e[0KAttempting to publish a package..."
    - /home/emscripten/scripts/npm_publish.sh "${SOURCE_DIR}" "${NPM_REGISTRY_URL}" "${NPM_PACKAGE_SCOPE}" "${NPM_PUBLISH_TOKEN}"
    - echo -e "\e[0Ksection_end:$(date +%s):publishing\r\e[0KDone"

  rules:
    - if: $QUICK_TEST == "true"
      when: never
    - if: $SKIP_DEV_DEPLOY == "true"
      when: never
    - if: $SKIP_NPM_PUBLISH == "true"
      when: never
    - when: on_success

# Base definition for NPM package publishing job to the registry.npmjs.org (PUBLIC production registry).
# The derived job, should have in its dependencies a final job performing a npm-build (derived from `.npm_build_template`)
#
# IMPORTANT: This template publishes to the PUBLIC npmjs.org registry!
# By default, only runs on protected tags with manual trigger.
#
# The job uses npm STAGED PUBLISHING (`npm stage publish`, npm >= 11.15). CI only stages the release; it does not go
# live until a maintainer approves it with 2FA. See docs/npmjs-staged-publishing.md for the full procedure. In short:
#   - token: npm granular access token, permission "Read and write (stage only)", scoped to the @hiveio packages/org
#   - stored as the protected, masked GitLab group variable `NPM_STAGE_TOKEN` (the only token this job reads)
#   - approve: `npm stage list <name>`, `npm stage download <id>`, compare with the GitLab-registry tarball,
#     then `npm stage approve <id> --otp <code>` (or approve it on npmjs.com)
#
# Every public (non-private) package of the pnpm workspace rooted at SOURCE_DIR is packed with `pnpm pack`
# (which resolves `workspace:`/`catalog:` specifiers and runs prepack scripts, as `pnpm publish` did before),
# unpacked into a clean directory and staged from there. A package whose version is already published or already
# staged is skipped, so the job can be re-run safely.
#
# Skip variables (set to "true" to skip this job):
#   - QUICK_TEST: Skip during quick test pipelines
#   - SKIP_PRODUCTION_DEPLOY: Skip all production deployments
#   - SKIP_NPM_PUBLISH: Skip all npm publishing jobs
.registry_npmjs_org_deploy_package_template:
  extends: .npm_process_built_package_tarball
  variables:
    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    # Target package name - it should be overrided by derived job
    NPM_PACKAGE_NAME: ""
    # Path to the built package tarball - it should be overrided by derived job
    PACKAGE_TGZ_PATH: ""
    # Directory (inside the project, so it can be kept as an artifact) holding the tarballs that were staged
    NPMJS_STAGE_DIR: "${CI_PROJECT_DIR}/npmjs-staged"

  script:
    # project version info must be regenerated accoring to correct target registry, package scope and name
    - /home/emscripten/scripts/npm_generate_version.sh "${SOURCE_DIR}" "registry.npmjs.org/" "@hiveio" "${NPM_PACKAGE_NAME}" "${CI_COMMIT_REF_PROTECTED}" "${CI_COMMIT_TAG}"
    - echo -e "\e[0Ksection_start:$(date +%s):publishing[collapsed=false]\r\e[0KAttempting to stage a package release at registry.npmjs.org..."
    - |
      set -euo pipefail
      NPMJS_REGISTRY="https://registry.npmjs.org/"
      NPM_MIN_STAGE_VERSION="11.15.0"

      NPM_VERSION="$(npm --version)"
      if [ "$(printf '%s\n%s\n' "${NPM_MIN_STAGE_VERSION}" "${NPM_VERSION}" | sort -V | head -n1)" != "${NPM_MIN_STAGE_VERSION}" ]; then
        echo "ERROR: npm ${NPM_VERSION} does not support staged publishing (npm >= ${NPM_MIN_STAGE_VERSION} required)."
        echo "Use an emsdk image >= 5.0.2-4 (EMSCRIPTEN_IMAGE_TAG) or a NODEJS_VERSION shipping a newer npm."
        exit 1
      fi

      STAGE_TOKEN="${NPM_STAGE_TOKEN:-}"
      if [ -z "${STAGE_TOKEN}" ]; then
        echo "ERROR: no npmjs token. Set the protected, masked group variable NPM_STAGE_TOKEN (stage-only granular token)."
        exit 1
      fi

      # Keep the token out of the project tree (and so out of artifacts and the project .npmrc)
      NPM_CONFIG_USERCONFIG="$(mktemp)"
      export NPM_CONFIG_USERCONFIG
      echo "//registry.npmjs.org/:_authToken=${STAGE_TOKEN}" > "${NPM_CONFIG_USERCONFIG}"

      rm -rf "${NPMJS_STAGE_DIR}"
      mkdir -p "${NPMJS_STAGE_DIR}/tarballs" "${NPMJS_STAGE_DIR}/unpacked"

      # Pack every public package of the workspace (just the root package for a non-workspace project)
      cd "${SOURCE_DIR}"
      pnpm --recursive ls --depth -1 --json | jq -r '.[] | select(.private != true) | .path' | while read -r PKG_DIR; do
        (cd "${PKG_DIR}" && pnpm pack --pack-destination "${NPMJS_STAGE_DIR}/tarballs")
      done

      shopt -s nullglob
      TARBALLS=("${NPMJS_STAGE_DIR}"/tarballs/*.tgz)
      if [ "${#TARBALLS[@]}" -eq 0 ]; then
        echo "ERROR: no public package found to stage in ${SOURCE_DIR}"
        exit 1
      fi

      for TARBALL in "${TARBALLS[@]}"; do
        PKG_DIR="${NPMJS_STAGE_DIR}/unpacked/$(basename "${TARBALL}" .tgz)"
        mkdir -p "${PKG_DIR}"
        tar -xzf "${TARBALL}" -C "${PKG_DIR}" --strip-components=1
        cd "${PKG_DIR}"

        NAME="$(jq -r '.name' package.json)"
        VERSION="$(jq -r '.version' package.json)"
        PACKAGE_DIST_TAG="$(jq -r '.publishConfig.tag // empty' package.json)"
        PACKAGE_DIST_TAG="${PACKAGE_DIST_TAG:-${BUILT_PACKAGE_DIST_TAG:-latest}}"
        echo "Package ${NAME}@${VERSION} (dist-tag: ${PACKAGE_DIST_TAG}), pnpm-pack sha512 (not the staged tarball; npm re-packs - compare contents): $(sha512sum "${TARBALL}" | cut -d' ' -f1)"

        # Published versions are public metadata - query without the token so a token problem cannot hide them
        if [ "$(NPM_CONFIG_USERCONFIG=/dev/null npm view "${NAME}@${VERSION}" version --registry "${NPMJS_REGISTRY}" 2>/dev/null || true)" = "${VERSION}" ]; then
          echo "${NAME}@${VERSION} is already published at npmjs - skipping"
          continue
        fi

        if STAGED_JSON="$(npm stage list "${NAME}" --json --registry "${NPMJS_REGISTRY}" 2>/dev/null)"; then
          if [ "$(jq --arg v "${VERSION}" '[.. | objects | select(.version? == $v)] | length' <<< "${STAGED_JSON}" 2>/dev/null || echo 0)" != "0" ]; then
            echo "${NAME}@${VERSION} is already staged at npmjs and awaits approval - skipping:"
            jq --arg v "${VERSION}" '[.. | objects | select(.version? == $v)]' <<< "${STAGED_JSON}"
            continue
          fi
        else
          echo "WARNING: npm stage list ${NAME} failed - assuming nothing is staged (npm stage publish rejects duplicates anyway):"
          jq -r '.error.summary? // .' <<< "${STAGED_JSON}" 2>/dev/null || true
        fi

        echo "Staging ${NAME}@${VERSION} with dist-tag ${PACKAGE_DIST_TAG}"
        # The directory holds the exact packed content - lifecycle scripts already ran during `pnpm pack`
        npm stage publish --access public --tag "${PACKAGE_DIST_TAG}" --registry "${NPMJS_REGISTRY}" --ignore-scripts
        echo "Staged. A maintainer must now approve it with 2FA: npm stage list ${NAME}; npm stage approve <stage-id> --otp <code>"
        npm stage list "${NAME}" --registry "${NPMJS_REGISTRY}" || true
      done

      rm -f "${NPM_CONFIG_USERCONFIG}"
    - echo -e "\e[0Ksection_end:$(date +%s):publishing\r\e[0KDone"

  artifacts:
    paths:
      - "npmjs-staged/tarballs/*.tgz"  # exact tarballs handed to `npm stage publish`, for comparison before approval
    when: always
    expire_in: 1 month

  rules:
    - if: $QUICK_TEST == "true"
      when: never
    - if: $SKIP_PRODUCTION_DEPLOY == "true"
      when: never
    - if: $SKIP_NPM_PUBLISH == "true"
      when: never
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true

# Allows to store generated documentation files inside a wiki repo specific to given project. Wiki repo must be explicitly created before using this job.
# Documentation files coming to protected branches are committed into root directory in the wiki repo. All other changes are pushed into non-stable/<branch-name> subdirectory what allows to render them by wiki.
.npm_push_doc_template:
  extends: .npm_based_job_base
  variables:
    # Must be overrided by derived job
    WIKI_PUSH_TOKEN: ""
    DOC_URL: "${GEN_DOC_URL}"

    # The directory containing sources to be built - it can be overrided by derived job
    SOURCE_DIR: "${CI_PROJECT_DIR}"
    PROJECT_URL: "${CI_PROJECT_URL}"
    SOURCE_PROJECT_URL: "${CI_PROJECT_URL}"
    # Output directory where should be stored `docs' subdirectory containing generated documentation files
    DIST_DIR: "$CI_PROJECT_DIR/dist"

  script:
    - cd "${CI_PROJECT_DIR}"
    - /home/emscripten/scripts/npm_push_doc.sh "${SOURCE_DIR}" "${PROJECT_URL}" "${WIKI_PUSH_TOKEN}" "${DIST_DIR}" "${CI_COMMIT_REF_NAME}" "${CI_COMMIT_REF_PROTECTED}" "${DOC_URL}" "${SOURCE_PROJECT_URL}"

.webapp_deploy_template:
  extends: .job-defaults
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 1

  before_script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
      echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
    - |
      # credits of solution for gitlab bug: https://gitlab.com/gitlab-org/gitlab/-/issues/294292#note_1070210709
      export DEPLOYMENT_ENV_FILE=${!DEPLOYMENT_ENV_FILE}
      # Make visible all vars in the bash env
      source "${DEPLOYMENT_ENV_FILE}"

      scripts/run_instance.sh \
        --image="$IMAGE_NAME" \
        --name="$CONTAINER_NAME" \
        --port=$PORT \
        --env-file="${DEPLOYMENT_ENV_FILE}" \
        --detach
  tags:
    - hs-denser # Runner dedicated to automatic deployments of web-apps

# Stop jobs template
.webapp_stop_template:
  extends: .job-defaults
  variables:
    CONTAINER_NAME: ""
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 1

  script:
    - docker ps -q --filter "name=$CONTAINER_NAME" | grep -q . && docker stop $CONTAINER_NAME
    - docker container rm --force "$CONTAINER_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  tags:
    - hs-denser # Runner dedicated to automatic deployments of web-apps
